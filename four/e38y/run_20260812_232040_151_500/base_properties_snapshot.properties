# Shared scenario properties for experiments/four baseline and gated series.
######### NFC section START #########
# B48 scenario definition (8-bin NCCR image-dominant extension)
# Target class:
#   5.62 < NCCR_total <= 10.00  AND  CCR_data < IDR_image
# Notes:
#   Use a practical relative gap rule in analysis
#   (recommended: CCR_data < IDR_image and |CCR_data-IDR_image| / ((CCR_data+IDR_image)/2) >= 20%).
# Verified snapshot (NFVSchedulingTest, random_seed=2503):
#   CCR_data=3.7167 / IDR_image=5.2602 / NCCR_total=8.9769
# Design strategy:
#   Start from the corresponding balanced E3X profile,
#   then decrease traditional data communication and increase image communication
#   so that the total NCCR stays in the same bucket while image communication dominates.

cloud_constrained_mode=1

# Whether to consider container image download
# 0: off, 1: on
cloud_container_dl_mode=1

# Optional fixed seed for reproducible experiments.
# Set a constant to avoid cross-run randomness when comparing algorithms.
random_seed=2503

# Core usage upper bound (%)
core_max_usage=75

# VNF usage increase (%) when assigned to vCPU
vnf_usage_min=20
vnf_usage_max=80

# 0: uniform, 1: normal
dist_vnf_usage=1
dist_vnf_usage_mu=0.5

vnf_type_min=1
vnf_type_max=20

# Instructions / 10^7
# Keep the B2-style low-NCCR balanced setting.
vnf_weight_min=2600
vnf_weight_max=7000
# 0: uniform, 1: normal
dist_vnf_weight=1
dist_vnf_weight_mu=0.5

# Data size between VNFs (MB)
# Increased from B37 to push CCR_data into the eighth NCCR bucket.
vnf_datasize_min=9700
vnf_datasize_max=13000
# 0: uniform, 1: normal
dist_vnf_datasize=1
dist_vnf_datasize_mu=0.5

# Number of VNFs in a single-SFC mode (not primary in this profile)
sfc_vnf_num=80

sfc_vnf_outdegree_min=1
sfc_vnf_outdegree_max=3

sfc_vnf_startnumrate=0.10
sfc_vnf_deapthalpha=1

# Multiple SFC mode
multiple_sfc_num=4
multiple_sfc_vnf_num_min=90
multiple_sfc_vnf_num_max=140
dist_multiple_sfc_vnf_num=1
dist_multiple_sfc_vnf_num_mu=0.5

datacenter_num=6

# DC external BW (MBps)
datacenter_externalbw_min=500
datacenter_externalbw_max=1000

host_num_foreachdc_min=3
host_num_foreachdc_max=5

# Number of VMs per host
vm_num_foreachdc_min=3
vm_num_foreachdc_max=5

# 0: uniform, 1: normal
dist_host_cpu_num=1
dist_host_cpu_num_mu=0.5
host_cpu_num_min=1
host_cpu_num_max=2
host_core_num_foreachcpu_min=2
host_core_num_foreachcpu_max=18
host_thread_num_foreeachcore=2
offload_program_datasize=2

# Memory (MB)
vm_mem_min=1024
vm_mem_max=8192

# Host MIPS
# 0: uniform, 1: normal
dist_host_mips=1
dist_host_mips_mu=0.5
host_mips_min=1000
host_mips_max=4000

# Core speed ratio to CPU speed
core_mips_rate_min=1.0
core_mips_rate_max=1.0

# Host BW (MBps)
dist_host_bw=1
dist_host_bw_mu=0.35
host_bw_min=1000
host_bw_max=2000

# VM CPI
vm_cpi=1

# Number of vCPUs per VM
dist_vm_vcpu_num=1
dist_vm_vcpu_num_mu=0.5
vm_vcpu_num_min=1
vm_vcpu_num_max=3

# For VNFScheduling level calculation
# 0: average, 1: max, 2: min
calcmode_level=0

# For Fair VNF Scheduling Algorithm
nfv_fairness_weight_overlap=0.5

# For VNF-COUHF Algorithm
# 0: one vCPU, 1: vCPUs in host, 2: all vCPUs, 3: custom
cmwsl_sched_area=3

# Number of mobile devices
mobile_device_num=10
mobile_device_core_num_min=2
mobile_device_core_num_max=4
# Instructions per second / 10^7
mobile_device_cpu_mips_min=10
mobile_device_cpu_mips_max=25
# mbps
mobile_device_bw_min=10
mobile_device_bw_max=50

mobile_device_power_min=60.0
mobile_device_power_max=100.0
dist_mobile_device_power=1
dist_mobile_device_power_mu=0.5

mobile_device_gain_min=0.3
mobile_device_gain_max=0.9
dist_mobile_device_gain=1
dist_mobile_device_gain_mu=0.5

mobile_device_back_noise=100
mec_channel_num=14

mobile_device_tau_min=0.7
mobile_device_tau_max=0.9
dist_mobile_device_tau=1
dist_mobile_device_tau_mu=0.5

# Image size range (MB)
# Increased from B37 while keeping CCR_data ~= IDR_image.
vnf_image_size_min=6000
vnf_image_size_max=7700

# Repository bandwidth (MBps)
repository_bw=2000
